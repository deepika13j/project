<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Healthcare Recommendation</title>

<link rel="stylesheet" href="recommendation.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<div class="logo">

<i class="fa-solid fa-heart-pulse"></i>

SmartCare

</div>

</header>

<div class="container">

<h1>Your Healthcare Recommendation</h1>

<div class="card">

<h2>Symptoms</h2>

<p id="symptoms"></p>

</div>

<div class="card">

<h2>Severity</h2>

<h3 id="severity"></h3>

</div>

<div class="card">

<h2>Recommended Healthcare Level</h2>

<h3 id="hospitalLevel"></h3>

</div>

<div class="card">

<h2>Recommended Department</h2>

<h3 id="department"></h3>

</div>

<div class="card">

<h2>Reason</h2>

<p id="reason"></p>

</div>

<button id="continueBtn">

Find Nearby Hospitals

</button>

</div>

<script src="recommendation.js"></script>

</body>

</html>
