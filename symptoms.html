<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Symptom Assessment</title>

<link rel="stylesheet" href="symptoms.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<div class="logo">

<i class="fa-solid fa-heart-pulse"></i>

SmartCare

</div>

</header>

<div class="container">

<h1>Symptom Assessment</h1>

<p>Please select your symptoms carefully.</p>

<!-- Symptoms -->

<div class="section">

<h2>Select Symptoms</h2>

<div class="checkbox-grid">

<label><input type="checkbox" value="Fever"> Fever</label>

<label><input type="checkbox" value="Cold"> Cold</label>

<label><input type="checkbox" value="Cough"> Cough</label>

<label><input type="checkbox" value="Headache"> Headache</label>

<label><input type="checkbox" value="Chest Pain"> Chest Pain</label>

<label><input type="checkbox" value="Breathing Difficulty"> Breathing Difficulty</label>

<label><input type="checkbox" value="Vomiting"> Vomiting</label>

<label><input type="checkbox" value="Stomach Pain"> Stomach Pain</label>

<label><input type="checkbox" value="Fracture"> Fracture</label>

<label><input type="checkbox" value="Injury"> Injury</label>

<label><input type="checkbox" value="Diabetes"> Diabetes</label>

<label><input type="checkbox" value="High Blood Pressure"> High Blood Pressure</label>

</div>

</div>

<!-- Onset -->

<div class="section">

    <h2>Symptom Onset</h2>

    <input
        type="date"
        id="onset"
        name="onset"
    >

</div>

<!-- Duration -->

<div class="section">

<h2>Symptom Duration</h2>

<select id="duration">

<option value="">Select</option>

<option>Less than 24 Hours</option>

<option>1-3 Days</option>

<option>4-7 Days</option>

<option>More than 1 Week</option>

<option>More than 1 Month</option>

</select>

</div>

<!-- Pain -->

<div class="section">

<h2>Pain Level</h2>

<input type="range"
id="pain"
min="1"
max="10"
value="5">

<p>

Pain Level :
<span id="painValue">5</span>

</p>

</div>

<!-- Notes -->

<div class="section">

<h2>Additional Notes</h2>

<textarea
id="notes"
rows="5"
placeholder="Describe your condition..."></textarea>

</div>

<button id="analyzeBtn">

Analyze Symptoms

</button>

</div>

<script src="symptoms.js"></script>

</body>

</html>
